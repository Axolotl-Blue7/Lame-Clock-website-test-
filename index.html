<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Test Page</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.4s ease;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: background-color 0.4s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
        }

        .clock {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 1.5rem 0;
            font-family: monospace;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome, friend! 😎</h1>
        <p>Axolotl 4 Life.</p>

        <div class="clock" id="clock">00:00:00</div>

        <div class="btn-group">
            <button onclick="changeTheme('#0f172a', '#1e293b', '#38bdf8')">Dark</button>
            <button onclick="changeTheme('#f8fafc', '#ffffff', '#0284c7')">Light</button>
            <button onclick="changeTheme('#14532d', '#166534', '#4ade80')">Forest</button>
        </div>
    </div>

    <script>
        // Update Live Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Change Color Theme
        function changeTheme(bg, cardBg, accent) {
            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--card-bg', cardBg);
            document.documentElement.style.setProperty('--accent-color', accent);
            
            // Adjust text color for light theme contrast
            const textColor = bg === '#f8fafc' ? '#0f172a' : '#f8fafc';
            document.documentElement.style.setProperty('--text-color', textColor);
        }
    </script>

</body>
</html>
